<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pak British CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8f8;--s:#fff;--t:#2a1a1e;--m:#7a6268;--r:#ff0000;--rd:#d90000;--b:#ffd6d6;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f11;--s:#211619;--t:#f6eeef;--m:#b9a7aa;--r:#ff2a2a;--rd:#ff6b6b;--b:#3d2b2f}}
:root[data-theme="dark"]{--bg:#150f11;--s:#211619;--t:#f6eeef;--m:#b9a7aa;--r:#ff2a2a;--rd:#ff6b6b;--b:#3d2b2f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
h2,h3,nav h1,.kpi b,.hd b{font-family:"Anton","Oswald","Bebas Neue","Arial Narrow",Impact,sans-serif;font-weight:400;letter-spacing:.02em}
h2{font-size:30px}h3{font-size:19px}nav h1{font-size:18px}
.hd{position:sticky;top:0;z-index:5;height:64px;background:#000;border-bottom:3px solid #ff0000;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(12px,2vw,24px);color:#fff}
.hd img{height:54px;width:auto;display:block}.hd b{font-size:clamp(14px,2.2vw,20px)}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.35);opacity:1}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rv{animation:up .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.hero:after{animation:glow 6s ease-in-out infinite}
.hero:before{content:"";position:absolute;left:28px;bottom:0;height:4px;width:120px;background:var(--r);transform-origin:left;animation:sweep 1s .5s cubic-bezier(.2,.7,.2,1) both}
.mq{overflow:hidden;margin-bottom:22px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq>div{display:flex;gap:8px;width:max-content;animation:mq 32s linear infinite}.mq:hover>div{animation-play-state:paused}
.mq span{border:1px solid var(--r);color:var(--rd);border-radius:99px;padding:3px 14px;font-size:13px;background:var(--s);white-space:nowrap}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(pointer:fine){html.pbc,html.pbc *{cursor:none!important}}
.pbc-ring,.pbc-ic,.pbc-rip{position:fixed;left:0;top:0;pointer-events:none;will-change:transform}
.pbc-ring{z-index:9998;width:46px;height:46px;margin:-23px 0 0 -23px;border:2px solid #ff0000;border-radius:50%;transition:width .2s,height .2s,margin .2s,background .2s,opacity .25s}
.pbc-ring.h{width:70px;height:70px;margin:-35px 0 0 -35px;background:rgba(255,0,0,.12)}
.pbc-ic{z-index:9999;width:40px;margin:-14px 0 0 -20px;filter:drop-shadow(0 0 1px rgba(0,0,0,.8)) drop-shadow(0 2px 3px rgba(0,0,0,.35));transition:opacity .25s}
.pbc-ic img{width:100%;display:block;transition:transform .2s}
.pbc-ic.h img{transform:scale(1.3) rotate(-8deg)}
.pbc-ic.d img{transform:scale(.75)}
.pbc-rip{z-index:9997;width:20px;height:20px;margin:-10px 0 0 -10px;border:2px solid #ff0000;border-radius:50%;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(4);opacity:0}}
.pbc-off{opacity:0}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:linear-gradient(170deg,#ff1a1a,#b30000);color:#fff;padding:18px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
nav h1{font-size:16px;margin:0 8px 2px;line-height:1.25}nav small{display:block;margin:0 8px 16px;opacity:.85;font-size:12px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.14)}nav button.on{background:#fff;color:var(--rd);font-weight:600}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffb3c0;outline-offset:2px}
main{padding:26px clamp(16px,3vw,40px);max-width:1150px;width:100%}
h2{font-size:26px;margin:0 0 4px}h3{font-size:17px;margin:0 0 8px;color:var(--rd)}
.sub{color:var(--m);margin:0 0 20px;max-width:70ch}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:18px;box-shadow:0 8px 20px -14px rgba(255,0,0,.35)}
.card.big{border-top:5px solid var(--r);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;transition:transform .15s}
.card.big:hover{transform:translateY(-3px)}
.kpi{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.hero{background:linear-gradient(120deg,#fff,#ffe5e5);border:1px solid var(--b);border-radius:22px;padding:28px;margin-bottom:22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(#ff000040,transparent 70%)}
.hero h2{font-size:clamp(24px,4vw,36px);color:#b30000}.hero .sub{color:#5c3a3a;margin:0}
.srch{max-width:360px;margin-bottom:16px}
.kpi div{background:linear-gradient(135deg,#ff1a1a,#d90000);color:#fff;border-radius:14px;padding:12px 18px;min-width:130px}
.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;opacity:.9}
ul{margin:0;padding-left:18px}li{margin:3px 0}li i{font-style:normal;color:var(--m)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid var(--r);color:var(--rd);border-radius:99px;padding:2px 10px;font-size:13px}
.tag{display:inline-block;background:var(--r);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;margin-left:6px}
.note{background:var(--s);border-left:4px solid var(--r);padding:10px 14px;border-radius:6px;color:var(--m);font-size:13px;margin:0 0 18px}
a{color:var(--rd)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b);vertical-align:top}th{background:#ffe5e5;color:#b30000}
.scroll{overflow-x:auto}
form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px}
input,select{padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;width:100%}
.btn{background:var(--r);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
.sec{margin-bottom:22px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
@media(max-width:800px){.app{display:block}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;padding:10px}nav h1,nav small{width:100%}nav button{width:auto}}
.y,:root{--y:#ffc400}
.hd{box-shadow:0 3px 0 var(--y)}
nav button.on{box-shadow:inset 5px 0 0 var(--y)}
.tag{background:var(--y);color:#2a1a1e}
.card.big:hover{box-shadow:0 12px 26px -14px rgba(255,170,0,.9),0 0 0 2px var(--y)}
.kpi div:nth-child(even){background:linear-gradient(135deg,#ffd633,#ffb300);color:#2a1a1e}
.hero{background:linear-gradient(120deg,#fff 0%,#fff3cf 60%,#ffe5e5 100%)}
.hero:before{width:170px;background:linear-gradient(90deg,#ff0000,#ffc400)}
.mq span:nth-child(3n){border-color:var(--y);background:#fff8dc;color:#5c4300}
.chips span:nth-child(even){border-color:var(--y);color:var(--t)}
.btn:hover{background:var(--y);color:#2a1a1e}
th{border-bottom:2px solid var(--y)}
.note{border-left-color:var(--y)}
.pbc-ring.h{border-color:var(--y);background:rgba(255,196,0,.16)}
.pre{opacity:0}
.rv{animation-fill-mode:backwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes navin{from{opacity:0;transform:translateX(-18px)}}
@keyframes float{50%{transform:translateY(-3px)}}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(360%)}}
@keyframes flash{from{background:#ffd633}to{background:transparent}}
nav.first h1,nav.first small,nav.first button{animation:navin .5s cubic-bezier(.2,.7,.2,1) backwards}
nav button{transition:background .2s,transform .2s}nav button:hover{transform:translateX(4px)}
.hd img{animation:float 4.5s ease-in-out infinite}
.hd:after{content:"";position:absolute;left:0;bottom:-3px;height:3px;width:28%;background:linear-gradient(90deg,transparent,#ff0000,transparent);animation:run 3.2s linear infinite}
.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px)}
.chips span{transition:transform .15s,background .15s,color .15s}.chips span:hover{transform:translateY(-2px) scale(1.06);background:var(--r);color:#fff}
tr td{transition:background .15s}tr:hover td{background:rgba(255,196,0,.2)}
.flash td{animation:flash 1.6s ease-out}
.btn{transition:transform .12s,background .2s}.btn:active{transform:scale(.94)}
body.locked>header,body.locked>.app{display:none}body:not(.locked)>#login{display:none}
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:auto;padding:20px;background:radial-gradient(circle at 15% 10%,rgba(255,0,0,.18),transparent 45%),radial-gradient(circle at 90% 90%,rgba(255,196,0,.3),transparent 40%),var(--bg)}
.lbox{width:min(400px,100%);background:var(--s);border:1px solid var(--b);border-top:5px solid var(--r);border-radius:20px;padding:0 26px 26px;box-shadow:0 20px 40px -22px rgba(255,0,0,.6);animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.lbox .lt{background:#000;margin:0 -26px 18px;padding:14px;display:flex;justify-content:center;border-radius:15px 15px 0 0;box-shadow:0 3px 0 var(--y)}.lbox .lt img{height:88px;animation:float 4.5s ease-in-out infinite}
.lbox h1{font-family:"Anton","Oswald",Impact,sans-serif;font-weight:400;letter-spacing:.02em;font-size:30px;margin:0;color:var(--rd)}.ls{color:var(--m);margin:2px 0 16px}
.lbox label{display:block;font-weight:600;margin-bottom:12px}.lbox label input{margin-top:4px}
.pw{position:relative;display:block}.pw input{padding-right:64px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);margin-top:2px;background:none;border:0;color:var(--rd);font:inherit;font-weight:600;cursor:pointer;padding:6px}
#le{color:#d90000;margin:0 0 10px;font-size:14px}.lbox .btn{width:100%;padding:12px;font-size:16px}
.lbox.err{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.hr{display:flex;align-items:center;gap:14px}.usr{font-size:13px;opacity:.8}.so{padding:7px 14px}
@media(max-width:560px){.hd b,.usr{display:none}}
main{background:radial-gradient(520px 260px at 100% 0,rgba(255,196,0,.22),transparent 70%),radial-gradient(460px 280px at 0 100%,rgba(255,0,0,.09),transparent 70%)}
.hero.dh{background:var(--g);border:0;color:#fff;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 18px 34px -20px rgba(255,0,0,.8)}
.dh:after{background:radial-gradient(rgba(255,196,0,.6),transparent 70%)}
.dh h2{color:#fff;margin:0 0 4px}.dh .sub{color:rgba(255,255,255,.92);max-width:62ch}.dh .tag{margin-left:10px;vertical-align:middle;font:700 13px "Segoe UI",sans-serif}
.dtx{flex:1;min-width:220px;position:relative;z-index:1}
.dic{font-size:44px;width:78px;height:78px;display:grid;place-items:center;border-radius:20px;background:rgba(255,255,255,.2);animation:float 4s ease-in-out infinite;position:relative;z-index:1}
.dh .btn{background:#ffc400;color:#2a1a1e;font-weight:700;position:relative;z-index:1}.dh .btn:hover{background:#fff}
.ci{font-size:1.25em}
.nb{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--r);color:#fff;font:700 14px "Segoe UI",sans-serif;margin-right:9px;vertical-align:middle}
.card.c0{border-top:4px solid #ff0000}.card.c1{border-top:4px solid #ffc400}.card.c1 .nb{background:#ffc400;color:#2a1a1e}
.card.c2{border-top:4px solid var(--t)}.card.c2 .nb{background:var(--t);color:var(--bg)}.card.c3{border-top:4px solid #ff7a00}.card.c3 .nb{background:#ff7a00}
li::marker{color:var(--r)}
th{background:linear-gradient(90deg,#ff0000,#ff7a00);color:#fff;border-bottom:0}
tr:nth-child(even) td{background:rgba(255,196,0,.08)}
.card table td:first-child{border-left:4px solid var(--y)}
tr:hover td{background:rgba(255,196,0,.22)}
.art{width:230px;flex:none;position:relative;z-index:1;animation:float 5s ease-in-out infinite}.art svg{display:block;width:100%;height:auto}
.hh{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
@media(max-width:1000px){.art{display:none}}
</style></head><body class="locked">
